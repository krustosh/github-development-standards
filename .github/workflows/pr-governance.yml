name: Reusable PR Governance

on:
  workflow_call:
    inputs:
      jira_base_url:
        description: "Base URL of the Jira instance"
        required: true
        type: string

jobs:
  validate-pr:
    name: Validate Pull Request Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shared standards
        uses: actions/checkout@v4
        with:
          repository: krustosh/github-development-standards
          ref: v1.0.0
          path: github-development-standards

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install shared standards dependencies
        working-directory: github-development-standards
        run: npm ci

      - name: Validate PR
        working-directory: github-development-standards
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        run: npm run validate:pr
