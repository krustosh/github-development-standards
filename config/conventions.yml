version: "1.0"

jira:
  enabled: true
  ticket_pattern: "^[A-Z][A-Z0-9]+-[0-9]+$"

branches:
  allowed:
    - feature
    - bugfix
    - hotfix
    - chore
    - refactor
    - docs
  pattern: "^(feature|bugfix|hotfix|chore|refactor|docs)/[A-Z][A-Z0-9]+-[0-9]+-[a-z0-9]+(?:-[a-z0-9]+)*$"

commits:
  allowed_types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert

  pattern: "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert): .{3,}$"

pull_requests:
  require_jira_ticket: true
  require_jira_url: true
  require_ticket_in_branch: true
  require_ticket_match: true
